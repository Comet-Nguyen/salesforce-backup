name: CI - Enhanced Security & Quality

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Pinned once, referenced by both the pip-cache key and the install
  # command, so a version bump here invalidates the cache automatically.
  SAM_CLI_VERSION: "1.161.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-validation:
    name: SAM validate + cfn-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # aws-actions/setup-sam is blocked by org action-allowlist policy.
      # Install via pip instead of the action - unaffected by the allowlist
      # since it's a `run:` step, not a third-party action.
      #
      # Explicit cache keyed on the PINNED sam-cli version (not on
      # requirements.txt - that file belongs to unrelated app dependencies
      # and would never invalidate this cache when sam-cli itself releases
      # a new version). Skip the pip install entirely on cache hit.
      - name: Cache AWS SAM CLI
        id: cache-sam
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}/lib/python3.12/site-packages/samcli
          key: sam-cli-${{ runner.os }}-py3.12-${{ env.SAM_CLI_VERSION }}
      - name: Install AWS SAM CLI
        if: steps.cache-sam.outputs.cache-hit != 'true'
        run: pip install "aws-sam-cli==${{ env.SAM_CLI_VERSION }}"
      - name: sam validate --lint
        run: sam validate --lint --template template.yaml --region us-west-2
      - name: cfn-lint (explicit)
        run: |
          pip install cfn-lint
          cfn-lint template.yaml

  code-quality:
    name: Lint & Test (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies & Ruff
        run: |
          pip install --upgrade pip
          if [ -f src/backup/requirements.txt ]; then 
            pip install -r src/backup/requirements.txt; 
          fi
          pip install "ruff==0.16.1" pytest

      # ==================== RUFF CACHE ====================
      - name: Cache Ruff
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      # ====================================================

      - name: Syntax check
        run: |
          python -m py_compile src/backup/salesforce_backup.py
          python -m py_compile src/rotation/rotation_function.py

      - name: Ruff Lint
        run: ruff check . --output-format=github

      - name: Ruff Format check
        run: ruff format --check .

      - name: Run Tests (pytest)
        run: |
          if [ -d tests ]; then 
            pytest; 
          else 
            echo "No tests/ directory yet - skipping"; 
          fi

  iac-security:
    name: Policy-as-Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Checkov
        run: pip install checkov
      - name: Scan Template with Checkov
        run: checkov -f template.yaml --framework cloudformation --soft-fail

  # ==================== SO D GUARD - REFINED WITH CFN-LINT ====================
  encrypt-only-guard:
    name: SoD guard - Backup role is encrypt-only (cfn-lint custom rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      # Structure-aware guard via cfn-lint custom rule E9001
      # (.github/cfn-lint-rules/sod_backup_role.py). Catches wildcard grants
      # (s3:*, kms:*, s3:Get*) that a text grep would miss.
      # NOTE: --append-rules takes a DIRECTORY of Python rules, not file paths.
      - name: Run SoD Custom Rule (E9001)
        run: |
          echo "Running SoD (encrypt-only) guard for the backup role..."

          # Full lint with the custom rule appended; the verdict below keys on
          # E9001 only (other findings are template-validation's concern).
          # Pipeline exit code is tee's, so a nonzero cfn-lint won't kill the
          # step before we grep.
          cfn-lint template.yaml \
            --append-rules .github/cfn-lint-rules 2>&1 | tee /tmp/sod-output.txt

          if grep -q "E9001" /tmp/sod-output.txt; then
            echo "::error::SoD violation detected! Backup role must remain encrypt-only."
            exit 1
          fi

          echo "SoD guard passed: backup role is strictly encrypt-only."
  # ==========================================================================

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # Pinned so the scan is reproducible; bump deliberately, not silently.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # full history - gitleaks scans past commits too

      # gitleaks/gitleaks-action is blocked by the org action-allowlist
      # policy (it is also being sunset upstream: Node 20 runners are
      # removed org-wide on 2026-09-16, which would break @v2 regardless).
      # Download the binary release directly instead - a `run:` step, not
      # a third-party action.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (SARIF report)
        id: gitleaks
        run: >
          gitleaks detect --source . --log-opts="--all"
          --report-format sarif --report-path gitleaks-report.sarif
          --redact --exit-code 1
        continue-on-error: true   # upload the report even when leaks are found

      # github/codeql-action@* in the org allowlist only matches actions at
      # the REPO ROOT of codeql-action - subpath actions like upload-sarif,
      # analyze, init need the pattern written as `github/codeql-action/*@*`.
      # Until the platform team updates that allowlist entry, attach the
      # SARIF report as a build artifact instead - it doesn't populate the
      # Security tab automatically, but the findings are preserved and
      # downloadable from every run.
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-report
          path: gitleaks-report.sarif
          retention-days: 90

      - name: Fail the job if secrets were found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks found potential secrets - see the Security tab for details."
          exit 1

  lzv2-security-scan:
    name: LZv2 Security Scan
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      security-events: write
      issues: write
    secrets: inherit
    with:
      python_lock_file: src/backup/requirements.txt